name: Metrics
on:
  workflow_dispatch:

# Add repo secret METRICS_TOKEN (classic PAT with repo + read:user), then run this
# workflow once. Optionally add:
#   schedule: [{ cron: "0 0 * * *" }]
#   push: { branches: ["main", "master"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Panel · general
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: laraib-sidd
          filename: metrics.general.svg
          base: header
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

      - name: Panel · stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: laraib-sidd
          filename: metrics.stats.svg
          base: activity, community
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes

      - name: Panel · stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: laraib-sidd
          filename: metrics.stars.svg
          base: ""
          plugins_errors_fatal: no
          plugin_stars: yes
          plugin_stars_limit: 4
